# Builds www.fastclick.dev: landing page, wiki, per-element reference and Doxygen API.
name: Deploy documentation site

on:
  push:
    branches: ["main", "generate-doc"]
  # Rebuild when the wiki is edited
  gollum:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen mawk
          python3 -m pip install markdown pygments
      - name: Configure
        run: ./configure
      - name: Fetch the wiki
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" _wiki
      - name: Generate element and tool documentation
        run: |
          mkdir -p _elements
          make -C doc install-man-markdown O="$PWD/_elements"
      - name: Build Doxygen API documentation
        run: make -C doc doxygen O="$PWD/_api"
      - name: Build the site
        run: python3 site/build.py --wiki _wiki --elements _elements --api _api --out _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
